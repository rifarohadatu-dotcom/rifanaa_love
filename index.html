<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Rifana</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #heart-container {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      font-size: clamp(7px, 2.2vw, 13px);
      line-height: 1.15;
      letter-spacing: 1px;
      color: #ff69b4;
      text-shadow: 
        0 0 5px #ff1493,
        0 0 12px #ff1493,
        0 0 22px #ff007f;
      white-space: pre;
      text-align: center;
      user-select: none;
      animation: heartbeat 1.4s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.06);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.04);
      }
      60% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <div id="heart-container"></div>

  <script>
    const word = "RIFANA";
    const container = document.getElementById("heart-container");
    let output = "";
    let charIndex = 0;

    // Rumus matematika untuk membentuk pola hati yang simetris dan pas
    for (let y = 1.3; y >= -1.1; y -= 0.085) {
      let line = "";
      for (let x = -1.3; x <= 1.3; x += 0.042) {
        // Persamaan kurva hati: (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
        const formula = Math.pow(x * x + y * y - 1, 3) - (x * x * Math.pow(y, 3));
        if (formula <= 0) {
          line += word[charIndex % word.length];
          charIndex++;
        } else {
          line += " ";
        }
      }
      output += line + "\n";
    }

    container.textContent = output;
  </script>

</body>
</html>
